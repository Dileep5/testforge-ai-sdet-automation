# Proves the artifact sanitizer on GitHub without failing any application test. It builds a synthetic
# run with dummy secrets, sanitizes it, uploads only the public copy, and checks what was uploaded.
name: Sanitizer self-test

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  TESTFORGE_ALLOW_LIVE_LLM: "0"

jobs:
  sanitize:
    name: Sanitize a synthetic run
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-test-env
      - name: Build, sanitize and check the synthetic run
        run: npm run -s ai -- sanitize-self-test --workdir reports/sanitizer-self-test
      - name: Upload only the public copy
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sanitizer-self-test-${{ github.run_id }}
          path: reports/sanitizer-self-test/public
          retention-days: 7
          if-no-files-found: error

  verify-upload:
    name: Check what was actually uploaded
    needs: [sanitize]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-test-env
      - name: Download the artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: sanitizer-self-test-${{ github.run_id }}
          path: downloaded
      - name: Check the downloaded copy
        run: npm run -s ai -- sanitize-self-test --verify-only downloaded
