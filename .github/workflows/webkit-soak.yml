# Repeats the WebKit suite under controlled parallelism, to look for the unresolved input failure.
# Retries stay off, so a recurrence fails, and its sanitized evidence is kept for 30 days.
name: WebKit soak

on:
  workflow_dispatch:
    inputs:
      repeat-each:
        description: How many times to repeat each test.
        type: number
        default: 5

permissions:
  contents: read

jobs:
  soak-2-workers:
    uses: ./.github/workflows/playwright-job.yml
    with:
      name: webkit-soak-2-workers
      projects: webkit
      browsers: webkit
      min-tests: 65
      repeat-each: ${{ fromJSON(inputs.repeat-each) }}
      workers: 2
      retention-days: 30

  # Runners have 2 cores, so 4 workers deliberately oversubscribes them, to add timing pressure.
  soak-4-workers:
    uses: ./.github/workflows/playwright-job.yml
    with:
      name: webkit-soak-4-workers
      projects: webkit
      browsers: webkit
      min-tests: 65
      repeat-each: ${{ fromJSON(inputs.repeat-each) }}
      workers: 4
      retention-days: 30
