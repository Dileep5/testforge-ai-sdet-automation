name: Set up test environment
description: Pinned Node and Python, locked dependencies, and optionally Playwright browsers.

inputs:
  browsers:
    description: Space-separated Playwright browsers to install, or empty for none.
    required: false
    default: ""

runs:
  using: composite
  steps:
    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version-file: .nvmrc
        cache: npm
    - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
      with:
        python-version-file: .python-version
        cache: pip
        cache-dependency-path: |
          apps/api/requirements.lock
          ai/requirements.lock
    - name: Install locked dependencies
      shell: bash
      run: bash scripts/install-deps.sh
    - name: Restore browsers
      if: inputs.browsers != ''
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/.cache/ms-playwright
        key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-${{ inputs.browsers }}
    # The packages depend on the OS image and Playwright's version, and not on other dependencies.
    - name: Work out the system package cache key
      id: apt-key
      if: inputs.browsers != ''
      shell: bash
      run: |
        prefix="apt-${ImageOS}-"
        version="$(node -p "require('./package.json').devDependencies['@playwright/test']")"
        echo "prefix=$prefix" >> "$GITHUB_OUTPUT"
        echo "key=$prefix$version" >> "$GITHUB_OUTPUT"
    - name: Restore system packages
      id: apt-cache
      if: inputs.browsers != ''
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/.cache/apt-archives
        key: ${{ steps.apt-key.outputs.key }}
        restore-keys: |
          ${{ steps.apt-key.outputs.prefix }}
    - name: Install browsers and their system packages, within a time limit
      if: inputs.browsers != ''
      shell: bash
      env:
        BROWSERS: ${{ inputs.browsers }}
      # BROWSERS is a list, so it is split into words on purpose.
      run: bash scripts/install-browsers.sh $BROWSERS
    # Saved here, not at the end of the job, so a later test failure does not lose the download.
    - name: Save system packages
      if: inputs.browsers != '' && steps.apt-cache.outputs.cache-hit != 'true'
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/.cache/apt-archives
        key: ${{ steps.apt-key.outputs.key }}
